<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iterra labs — Coming Soon</title>
<link rel="icon" href="assets/iterra-labs-icon-zoomed-512.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #080d14;
    color: #fff;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  /* CANVAS */
  canvas {
    position: fixed;
    inset: 0; width: 100%; height: 100%;
    z-index: 0;
  }

  /* GLOW ORBS */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(130px); pointer-events: none; z-index: 0;
  }
  .orb-1 { width: 560px; height: 560px; top: -140px; left: -100px; background: radial-gradient(circle, rgba(41,173,240,0.18), transparent 70%); animation: drift1 18s ease-in-out infinite; }
  .orb-2 { width: 440px; height: 440px; bottom: -120px; right: -80px; background: radial-gradient(circle, rgba(45,212,160,0.14), transparent 70%); animation: drift2 22s ease-in-out infinite; }
  .orb-3 { width: 320px; height: 320px; top: 38%; left: 52%; background: radial-gradient(circle, rgba(27,122,82,0.10), transparent 70%); animation: drift3 26s ease-in-out infinite; }

  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(60px,40px)} 66%{transform:translate(-30px,70px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-50px,-40px)} 66%{transform:translate(40px,-70px)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,50px)} }

  /* MAIN */
  .container {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 40px 24px;
    width: 100%; max-width: 680px;
    gap: 0;
  }

  /* LOGO */
  .logo {
    width: 280px;
    height: auto;
    margin-bottom: 52px;
    animation: fadeUp 0.9s ease both;
    /* invert white areas to transparent for dark bg */
    /*filter: brightness(0) invert(1);*/
  }

  /* STATUS PILL */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(41,173,240,0.3);
    background: rgba(41,173,240,0.07);
    padding: 7px 18px; border-radius: 40px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: #29adf0;
    margin-bottom: 36px;
    animation: fadeUp 0.9s 0.12s ease both;
  }
  .pill-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #2dd4a0;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(45,212,160,0.6)} 50%{box-shadow:0 0 0 5px rgba(45,212,160,0)} }

  /* HEADLINE */
  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(44px, 9vw, 84px);
    font-weight: 900; line-height: 1.0; letter-spacing: -0.03em;
    margin-bottom: 24px;
    animation: fadeUp 0.9s 0.22s ease both;
  }
  .line1 { display: block; color: #fff; }
  .line2 {
    display: block;
    background: linear-gradient(135deg, #29adf0 0%, #2dd4a0 55%, #1b7a52 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  /* SUBLINE */
  .sub {
    font-size: clamp(15px, 2vw, 18px); font-weight: 400;
    color: rgba(255,255,255,0.42); line-height: 1.72;
    max-width: 460px; margin-bottom: 52px;
    animation: fadeUp 0.9s 0.32s ease both;
  }

  /* DIVIDER */
  .divider {
    width: 240px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(41,173,240,0.25), transparent);
    margin-bottom: 32px;
    animation: fadeUp 0.9s 0.42s ease both;
  }

  /* FOOTER */
  .footer {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;
    font-size: 12px; color: rgba(255,255,255,0.22);
    animation: fadeUp 0.9s 0.50s ease both;
  }
  .footer a { color: rgba(255,255,255,0.35); text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: rgba(255,255,255,0.7); }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.15); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .logo { width: 200px; margin-bottom: 40px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">

  <img class="logo" src="iterra labs white logo.png" alt="iterra labs">

  <div class="pill">
    <span class="pill-dot"></span>
    Under construction
  </div>

  <h1>
    <span class="line1">Something big</span>
    <span class="line2">is coming.</span>
  </h1>

  <p class="sub">We're building the AI and cloud engineering studio for ambitious companies. We'll be live very soon.</p>

  <div class="divider"></div>

  <div class="footer">
    <span>&copy; 2026 Iterra Labs</span>
    <span class="dot"></span>
    <a href="mailto:founder@iterralabs.com">founder@iterralabs.com</a>
    <span class="dot"></span>
    <span>AI &amp; Cloud Engineering</span>
  </div>

</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let nodes = [], traces = [], pulses = [], raf;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  init();
}

function init() {
  nodes = []; traces = []; pulses = [];
  const gap = 90;
  const cols = Math.ceil(canvas.width / gap) + 1;
  const rows = Math.ceil(canvas.height / gap) + 1;
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      if (Math.random() > 0.3) {
        nodes.push({
          x: c * gap + (Math.random() - 0.5) * 32,
          y: r * gap + (Math.random() - 0.5) * 32,
          r: Math.random() > 0.85 ? 3.5 : Math.random() > 0.6 ? 2 : 1,
          chip: Math.random() > 0.82
        });
      }
    }
  }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
      if (Math.hypot(dx, dy) < 120 && Math.random() > 0.52) {
        traces.push({ a: i, b: j, mx: nodes[i].x + dx * (0.3 + Math.random() * 0.4), routed: Math.random() > 0.65 });
      }
    }
  }
  for (let i = 0; i < 16; i++) addPulse();
}

function addPulse() {
  if (!traces.length) return;
  const t = traces[Math.random() * traces.length | 0];
  pulses.push({ t, p: Math.random(), s: 0.003 + Math.random() * 0.005, col: Math.random() > 0.5 ? "#29adf0" : "#2dd4a0" });
}

function posOn(t, p) {
  const a = nodes[t.a], b = nodes[t.b];
  if (!t.routed) return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p };
  if (p < 0.5) { const q = p * 2; return { x: a.x + (t.mx - a.x) * q, y: a.y }; }
  const q = (p - 0.5) * 2;
  return { x: t.mx + (b.x - t.mx) * q, y: a.y + (b.y - a.y) * q };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const t of traces) {
    const a = nodes[t.a], b = nodes[t.b];
    ctx.beginPath(); ctx.strokeStyle = "rgba(41,173,240,0.1)"; ctx.lineWidth = 0.7;
    if (!t.routed) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    else { ctx.moveTo(a.x, a.y); ctx.lineTo(t.mx, a.y); ctx.lineTo(t.mx, b.y); ctx.lineTo(b.x, b.y); }
    ctx.stroke();
  }
  for (const n of nodes) {
    if (n.chip) {
      const s = 6;
      ctx.strokeStyle = "rgba(45,212,160,0.22)"; ctx.lineWidth = 0.8;
      ctx.strokeRect(n.x - s, n.y - s, s * 2, s * 2);
      ctx.beginPath(); ctx.strokeStyle = "rgba(41,173,240,0.18)";
      [[-s,-3],[-s,3],[s,-3],[s,3]].forEach(([ox,oy]) => {
        ctx.moveTo(n.x + ox, n.y + oy); ctx.lineTo(n.x + (ox < 0 ? ox - 4 : ox + 4), n.y + oy);
      });
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = n.r > 2 ? "rgba(45,212,160,0.38)" : "rgba(41,173,240,0.2)"; ctx.fill();
      if (n.r > 2) {
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(45,212,160,0.08)"; ctx.lineWidth = 1; ctx.stroke();
      }
    }
  }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.p += p.s;
    const pos = posOn(p.t, p.p);
    const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 7);
    g.addColorStop(0, p.col); g.addColorStop(1, "transparent");
    ctx.beginPath(); ctx.arc(pos.x, pos.y, 7, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    if (p.p >= 1) { pulses.splice(i, 1); addPulse(); }
  }
  raf = requestAnimationFrame(draw);
}

resize(); draw();
window.addEventListener("resize", () => { cancelAnimationFrame(raf); resize(); draw(); });
</script>
</body>
</html>
